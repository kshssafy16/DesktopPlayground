<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: pet-asset:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DesktopPlayground 조작창</title>
  <link rel="stylesheet" href="controls.css">
</head>
<body>
  <main id="control-bar" role="toolbar" aria-label="DesktopPlayground 조작창">
    <button id="pc-button" class="mode-button icon-button" type="button" title="PC" aria-label="PC">🖥️</button>
    <button id="pets-button" class="mode-button icon-button" type="button" title="펫" aria-label="펫" aria-expanded="false">🐾</button>
    <button id="touch-button" class="mode-button icon-button" type="button" title="잡기" aria-label="잡기">✋</button>
    <button id="play-button" class="mode-button icon-button" type="button" title="놀이" aria-label="놀이" aria-expanded="false">🎲</button>
    <button id="draw-button" class="mode-button icon-button" type="button" title="그리기" aria-label="그리기" aria-expanded="false">✏️</button>
    <button id="visibility-button" class="action-button icon-button" type="button" title="전체 숨기기" aria-label="전체 숨기기"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9c-1.2 1.5-2 3-2 3 0 0 3.6 6 10 6 1.5 0 2.8-.3 4-.9M8 6.7A11 11 0 0 1 12 6c6.4 0 10 6 10 6a14 14 0 0 1-2.7 3.2M3 3l18 18"/></svg></button>
    <button id="toolbar-hide-button" class="action-button icon-button" type="button" title="툴바 숨김" aria-label="툴바 숨김"><svg class="toolbar-hide-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m9 10 6 5m0-5-6 5"/></svg></button>
    <button id="exit-button" class="action-button icon-button" type="button" title="종료" aria-label="종료"><svg class="power-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M6.5 5.6a9 9 0 1 0 11 0"/></svg></button>
    <button id="collapse-button" class="action-button icon-button" type="button" title="접기" aria-label="접기"><svg class="chevron-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
  </main>

  <section id="control-panel" aria-label="DesktopPlayground 메뉴" hidden>
    <div class="panel-heading">
      <strong id="panel-title">펫</strong>
      <button id="panel-close" type="button" aria-label="메뉴 닫기">×</button>
    </div>
    <div id="panel-list"></div>
  </section>
  <p id="error-message" role="status" aria-live="assertive"></p>

  <main id="mini-controls" role="toolbar" aria-label="접힌 DesktopPlayground 조작창">
    <button id="mini-visibility-button" type="button" title="전체 숨기기" aria-label="전체 숨기기"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9c-1.2 1.5-2 3-2 3 0 0 3.6 6 10 6 1.5 0 2.8-.3 4-.9M8 6.7A11 11 0 0 1 12 6c6.4 0 10 6 10 6a14 14 0 0 1-2.7 3.2M3 3l18 18"/></svg></button>
    <button id="expand-button" type="button" title="펼치기" aria-label="펼치기"><svg class="chevron-icon expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
    <button id="mini-exit-button" type="button" title="종료" aria-label="종료"><svg class="power-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M6.5 5.6a9 9 0 1 0 11 0"/></svg></button>
  </main>
  <script src="controls.js"></script>
</body>
</html>
